<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Organize sua rotina acadêmica com o StudyUp. Tarefas, projetos e prazos sob controle para você ir mais longe.">
  <meta name="theme-color" content="#ffffff">
  <title>StudyUp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="Study-page">
  <!-- Atividade 1: as classes Study conectam esta tela ao CSS de pages/study.css. -->
  <main class="Study-shell" aria-labelledby="Study-title">
    <!-- Ilustração decorativa: círculos e brilho no CSS; SVG nítido sem imagens externas. -->
    <div class="Study-visual" aria-hidden="true">
      <div class="Study-orbit">
        <div class="Study-mark Study-mark--hero">
          <svg class="Study-symbol" viewBox="0 0 48 48" fill="none">
            <path d="M5 18 24 9l19 9-19 9L5 18Zm8 5v9c0 3 5 7 11 7s11-4 11-7v-9M43 18v12" stroke="currentColor" stroke-width="2.8"stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        
          <span class="Study-plus">+</span>
        </div>
      </div>
    </div>

    <!-- Marca e chamada principal, na ordem de leitura da referência. -->
    <div class="Study-content">
      <div class="Study-brand" role="img" aria-label="StudyUp">
        <span class="Study-mark Study-mark--brand" aria-hidden="true">
          <svg class="Study-symbol" viewBox="0 0 48 48" fill="none">
            <path d="M5 18 24 9l19 9-19 9L5 18Zm8 5v9c0 3 5 7 11 7s11-4 11-7v-9M43 18v12" stroke="currentColor" stroke-width="2.8"stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          </svg>
          <span class="Study-plus">+</span>
        </span>
        <span class="Study-wordmark" aria-hidden="true">Study<span class="Study-wordmark-accent">Up</span></span>
      </div>

      <h1 class="Study-title" id="Study-title">
        <span class="Study-title-line">Organize sua rotina</span>
        <span class="Study-title-line">acadêmica aqui.</span>
      </h1>
      <p class="Study-description">Tarefas, projetos e prazos sob controle<br class="Study-description-break"> para você ir mais longe.</p>

      <!-- Navegação sem JavaScript. A apresentação será criada na atividade 2. -->
      <a class="Study-start" href="views/pages/landing.html">
        Começar <span aria-hidden="true">→</span>
      </a>
    </div>
  </main>
</body>
</html>
