<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">StudyUp — organize sua rotina acadêmica</title>
  <desc id="desc">Capa verde com a marca StudyUp em branco e dourado, mensagem à esquerda e símbolo acadêmico dentro de órbitas à direita.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#103f33"/><stop offset="1" stop-color="#176b50"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#38b585" stop-opacity=".24"/><stop offset="1" stop-color="#38b585" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="400" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <circle cx="974" cy="200" r="310" fill="url(#glow)"/>
    <g fill="none" stroke="#d3eee3">
      <circle cx="974" cy="200" r="236" opacity=".07"/>
      <circle cx="974" cy="200" r="182" opacity=".11"/>
      <circle cx="974" cy="200" r="128" opacity=".16"/>
    </g>
    <rect x="64" y="54" width="32" height="4" rx="2" fill="#ffdf78"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="110" y="61" fill="#d3eee3" font-size="13" font-weight="700" letter-spacing="2">ORGANIZAÇÃO ACADÊMICA</text>
      <text x="60" y="164" fill="#fff" font-size="84" font-weight="700" letter-spacing="-3">Study<tspan fill="#ffdf78">Up</tspan></text>
      <g fill="#ecf6f0" font-size="27">
        <text x="64" y="220">Mais clareza para estudar.</text>
        <text x="64" y="258">Mais espaço para evoluir.</text>
      </g>
      <g fill="#fff" fill-opacity=".05" stroke="#d3eee3" stroke-opacity=".20">
        <rect x="64" y="307" width="142" height="36" rx="18"/>
        <rect x="218" y="307" width="116" height="36" rx="18"/>
        <rect x="346" y="307" width="110" height="36" rx="18"/>
      </g>
      <g fill="#d3eee3" font-size="14" text-anchor="middle">
        <text x="135" y="330">Disciplinas</text>
        <text x="276" y="330">Tarefas</text>
        <text x="401" y="330">Prazos</text>
      </g>
    </g>
    <rect x="886" y="112" width="176" height="176" rx="48" fill="#123f33" fill-opacity=".55" stroke="#ffdf78" stroke-opacity=".25"/>
    <g transform="translate(902 124) scale(3)" fill="none" stroke="#ffdf78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 18 24 9l19 9-19 9L5 18Zm8 5v9c0 3 5 7 11 7s11-4 11-7v-9M43 18v12"/>
      <path d="M43 2v8M39 6h8" stroke="#fff"/>
    </g>
    <circle cx="974" cy="18" r="4" fill="#ffdf78"/>
    <circle cx="846" cy="200" r="4" fill="#ffdf78"/>
    <circle cx="1110" cy="321" r="5" fill="#d3eee3" fill-opacity=".65"/>
  </g>
